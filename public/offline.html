<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Traça</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f8f6f0 0%, #e8e4d8 100%);
      color: #4a3f35;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 400px;
    }

    .icon {
      font-size: 64px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #4C7052;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
      color: #6b5c4d;
    }

    .retry-btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #4C7052;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .retry-btn:hover {
      background-color: #3d5a42;
    }

    .brand {
      margin-top: 40px;
      font-size: 14px;
      color: #8b7d6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📚</div>
    <h1>Você está offline</h1>
    <p>
      Parece que você perdeu a conexão com a internet.
      Verifique sua conexão e tente novamente.
    </p>
    <a href="/" class="retry-btn" onclick="window.location.reload(); return false;">
      Tentar novamente
    </a>
    <div class="brand">Traça</div>
  </div>
</body>
</html>
